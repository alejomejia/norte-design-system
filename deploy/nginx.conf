# Serves the static Storybook on port 8080, as an unprivileged user. Dokploy's Traefik terminates HTTPS in front of it,
# behind Cloudflare.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # No nginx version in error pages and the Server header.
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

  # nginx drops the server's headers in a location that sets its own, so they live in one file each location includes.

  # Vite's bundles carry a hash in their names: a new build gets new names, so browsers keep these for a year.
  location /assets/ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Everything else (the HTML, Storybook's own bundles, index.json) keeps its name between builds: browsers check for a
  # newer one on every visit.
  location / {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
  }

  # The build has no dotfiles, and none should ever be served if one slips in.
  location ~ /\. {
    return 404;
  }
}
