# Publishes the package to GitHub Packages when a release tag is pushed (`git push origin main dev vX.Y.Z`), so the
# version apps install is built from exactly the tagged commit. Why GitHub Packages: docs/decisions/0019.
name: Publish

on:
  push:
    tags: ["v*"]
  # Publish a release by hand, if its tag's run failed or never started: Actions → Publish → Run workflow, from `dev`,
  # with the tag (`gh workflow run publish.yml --ref dev -f tag=v0.6.0`). The workflow comes from the branch, so a fix
  # to it applies to a tag that's already pushed, and the package is still built from the tag's own commit.
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to publish, like v0.6.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Check the tag matches the version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "::error::$TAG is not the version in package.json ($version). Publish a release tag, like $version."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@alejomejia"
          # Its cache would run pnpm before the next step installs it. A release doesn't need the cache.
          package-manager-cache: false

      # pnpm's version comes from `packageManager`, as in the Dockerfile.
      - run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # npm, not pnpm, publishes: it reads the token setup-node wrote, and the package has no workspace links to rewrite.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
